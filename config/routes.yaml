# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

# loads the #[Route] attributes first, so /hello/world (exercise 1) is matched before /hello/{name}
controllers:
    resource: routing.controllers

about:
    path: /about
    controller: App\Controller\DefaultController::about

# exercise 2: {name} is a wildcard, any text in that part of the url is accepted
hello_name:
    path: /hello/{name}
    controller: App\Controller\DefaultController::helloName

# exercise 3: \d means exactly one digit, so /increment/12 does not match and gives a 404
increment:
    path: /increment/{number}
    controller: App\Controller\DefaultController::increment
    requirements:
        number: '\d'

# exercise 4: the | means "or", so only hello, hi or welcome are allowed as the salutation
greeting:
    path: /greet/{salutation}/{name}
    controller: App\Controller\DefaultController::greeting
    requirements:
        salutation: 'hello|hi|welcome'

# exercise 5
contacts:
    path: /contacts
    controller: App\Controller\DefaultController::contacts

# doctrine exercise 3: the message in the url is saved as a new announcement
new_announcement:
    path: /new_announcement/{message}
    controller: App\Controller\DefaultController::newAnnouncement

# doctrine exercise 4a: {id} is the id of the announcement to show
show_announcement:
    path: /announcement/{id}
    controller: App\Controller\DefaultController::showAnnouncement

# doctrine exercise 4b: lists every announcement
all_announcements:
    path: /announcements
    controller: App\Controller\DefaultController::allAnnouncements
